apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database
  namespace: argo-cd

spec:
  project: default

  source:
    repoURL: https://github.com/MyoMinS/eks-project-lab-microservice.git
    targetRevision: main
    path: kubernetes/database

  destination:
    server: https://kubernetes.default.svc
    namespace: database-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true