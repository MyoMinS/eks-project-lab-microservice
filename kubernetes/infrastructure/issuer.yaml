apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: issuer

spec:
  acme:
    server: "https://acme-v02.api.letsencrypt.org/directory"
    email: "myominsoe432@gmail.com"
    privateKeySecretRef:
      name: issuer
    solvers:
    - dns01:
        route53:
          hostedZoneID: Z02287051Q3S7J1YFEGVB
          region: ap-southeast-1
      selector:
        dnsZones:
        - "myomins.website"
    - http01:
        ingress:
          class: traefik
