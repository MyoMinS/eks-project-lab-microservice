server:

  extraArgs:
  - --insecure
  service: 
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: issuer
    hosts:
    - argocd.myomins.website
    tls:
    - secretName: argocd-ingress-tls
      hosts:
      - argocd.myomins.website